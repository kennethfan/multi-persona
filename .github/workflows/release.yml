name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build-cmd: dist
            artifact-name: mac
          - os: windows-latest
            build-cmd: dist:win
            artifact-name: win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Sync version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "tag version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "console.log('package version:', require('./package.json').version)"
      - run: npm run ${{ matrix.build-cmd }}
      - run: ls -lh release/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: qian-dao-${{ matrix.artifact-name }}-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - run: ls -lhR dist-artifacts
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 千岛 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-artifacts/*.dmg
            dist-artifacts/*.exe
            dist-artifacts/*.blockmap
            dist-artifacts/latest*.yml
